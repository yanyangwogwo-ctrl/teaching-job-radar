name: Daily vacancy monitor

on:
  push:
    branches: [main]
    paths: ['monitor/**', 'scripts/**', 'config/**', 'requirements.txt', '.github/workflows/daily.yml']
  schedule:
    - cron: '17 0 * * *' # 08:17 Hong Kong; GitHub may start later.
  workflow_dispatch:

concurrency:
  group: vacancy-state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify monitor logic before crawling
        run: python -m unittest discover -s tests
      - name: Scrape public sources
        id: crawl
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          HEARTBEAT_URL: ${{ secrets.HEARTBEAT_URL }}
        run: python -m monitor.run
      - name: Persist jobs and pending alerts before sending
        id: persist_before
        run: python scripts/commit_data.py
      - name: Send pending Discord alerts
        id: notify
        if: steps.persist_before.outcome == 'success'
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          HEARTBEAT_URL: ${{ secrets.HEARTBEAT_URL }}
        run: python -m monitor.run --notify-only
      - name: Persist Discord acknowledgements
        if: always() && steps.persist_before.outcome == 'success'
        id: persist_after
        run: python scripts/commit_data.py
      - name: Report that the schedule ran
        if: always() && steps.persist_after.outcome == 'success'
        env:
          HEARTBEAT_URL: ${{ secrets.HEARTBEAT_URL }}
        run: python -m monitor.heartbeat
      - name: Keep failed sources visible in Actions
        if: always() && (steps.crawl.outcome == 'failure' || steps.notify.outcome == 'failure')
        run: |
          echo 'Some sources or notifications were incomplete. Committed public data and source warnings remain available to the dashboard.'
          exit 1
