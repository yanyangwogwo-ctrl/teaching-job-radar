name: Diagnose public recruitment TLS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/diagnose-tls.yml']

# No checkout, repository writes, application secrets or job-page requests.
permissions:
  contents: read

jobs:
  certificates:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Match the monitor's requests version
        run: python -m pip install requests==2.34.2
      - name: Verify the public TLS certificate chains from GitHub's runner
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import re
          import subprocess

          CERTIFICATE = re.compile(
              r'-----BEGIN CERTIFICATE-----\s+.*?-----END CERTIFICATE-----', re.S
          )

          def verification_status(output, returncode, chain):
              text = output.lower()
              reasons = (
                  ('unsafe legacy renegotiation disabled', 'legacy_renegotiation_required'),
                  ('unable to get local issuer certificate', 'issuer_chain_untrusted'),
                  ('unable to verify the first certificate', 'certificate_chain_incomplete_or_untrusted'),
                  ('certificate has expired', 'certificate_expired'),
                  ('hostname mismatch', 'hostname_mismatch'),
                  ('self-signed certificate', 'self_signed_certificate_untrusted'),
                  ('certificate verify failed', 'certificate_verification_failed'),
                  ('certificate_verify_failed', 'certificate_verification_failed'),
                  ('connection refused', 'connection_refused'),
                  ('name or service not known', 'dns_failed'),
                  ('temporary failure in name resolution', 'dns_failed'),
                  ('no peer certificate available', 'handshake_no_peer_certificate'),
              )
              for marker, label in reasons:
                  if marker in text:
                      return label
              if returncode == 0 and chain:
                  return 'verified'
              return 'tls_connection_failed'

          def public_certificate_fields(pem):
              # Parse public certificate metadata only. Do not emit raw PEM,
              # raw TLS transcripts, environment variables or arbitrary errors.
              try:
                  result = subprocess.run(
                      ['openssl', 'x509', '-noout', '-subject', '-issuer',
                       '-dates', '-ext', 'authorityInfoAccess'],
                      input=pem, text=True, capture_output=True, timeout=2,
                  )
              except (subprocess.TimeoutExpired, OSError):
                  return {'metadata_status': 'unavailable'}
              if result.returncode:
                  return {'metadata_status': 'unavailable'}
              fields = {'authority_information_access': []}
              for raw in result.stdout.splitlines():
                  line = raw.strip()
                  for prefix, key in [('subject=', 'subject'), ('issuer=', 'issuer'),
                                      ('notBefore=', 'valid_from'), ('notAfter=', 'expires_at')]:
                      if line.startswith(prefix):
                          fields[key] = line[len(prefix):][:1000]
                  if line.startswith(('CA Issuers - URI:', 'OCSP - URI:')):
                      fields['authority_information_access'].append(line[:1000])
              return fields

          def diagnose(host, legacy=False):
              mode = 'host_scoped_legacy_comparison' if legacy else 'standard'
              command = [
                  'openssl', 's_client', '-connect', host + ':443',
                  '-servername', host, '-verify_hostname', host,
                  '-verify_return_error', '-showcerts', '-CApath', '/etc/ssl/certs',
              ]
              if legacy:
                  # This diagnostic compares the explicitly approved EdUHK
                  # compatibility option. Certificate/hostname checks stay on.
                  command.append('-legacy_server_connect')
              try:
                  result = subprocess.run(command, input='', text=True,
                                          capture_output=True, timeout=20)
                  output = result.stdout + '\n' + result.stderr
                  chain = CERTIFICATE.findall(output)
                  status = verification_status(output, result.returncode, chain)
              except subprocess.TimeoutExpired:
                  chain, status = [], 'connection_timeout'
              except OSError:
                  chain, status = [], 'diagnostic_tool_unavailable'
              record = {'host': host, 'mode': mode, 'verification_status': status,
                        'chain_count': len(chain),
                        'certificates': [public_certificate_fields(pem) for pem in chain[:6]]}
              # JSON escapes untrusted certificate text and control characters.
              print(json.dumps(record, ensure_ascii=True, sort_keys=True), flush=True)

          # Hardcoded public hosts; no user-provided URLs, tokens or credentials.
          diagnose('hkuspace-plk.hku.hk')
          diagnose('www.eduhk.hk')
          diagnose('www.eduhk.hk', legacy=True)
          PY
      - name: Compare verified Python trust stores for HPSHCC robots only
        shell: bash
        run: |
          python - <<'PY'
          import json
          import platform
          import ssl
          from importlib.metadata import version
          from pathlib import Path

          import requests

          def tls_reason(error):
              # Inspect exception text locally; never print it or a response body.
              text = str(error).lower()
              reasons = (
                  ('unsafe legacy renegotiation disabled', 'legacy_renegotiation_required'),
                  ('unable to get local issuer certificate', 'issuer_chain_untrusted'),
                  ('unable to verify the first certificate', 'certificate_chain_incomplete_or_untrusted'),
                  ('certificate has expired', 'certificate_expired'),
                  ('hostname mismatch', 'hostname_mismatch'),
                  ('self-signed certificate', 'self_signed_certificate_untrusted'),
                  ('certificate verify failed', 'certificate_verification_failed'),
                  ('certificate_verify_failed', 'certificate_verification_failed'),
              )
              return next((label for marker, label in reasons if marker in text), 'tls_failed')

          print(json.dumps({'python': platform.python_version(), 'openssl': ssl.OPENSSL_VERSION,
                            'requests': requests.__version__, 'certifi': version('certifi'),
                            'urllib3': version('urllib3')}, sort_keys=True), flush=True)
          url = 'https://hkuspace-plk.hku.hk/robots.txt'
          for label, trust_store in [('requests_default_certifi', True),
                                    ('ubuntu_system_ca_bundle', '/etc/ssl/certs/ca-certificates.crt')]:
              result = {'host': 'hkuspace-plk.hku.hk', 'path': '/robots.txt',
                        'trust_store': label, 'http_status': None}
              if isinstance(trust_store, str) and not Path(trust_store).is_file():
                  result['verification_status'] = 'trust_store_unavailable'
              else:
                  try:
                      # Normal verified HTTPS only. No redirects, credentials,
                      # job advertisements or response-body reads.
                      with requests.get(url, verify=trust_store, stream=True,
                                        allow_redirects=False, timeout=(10, 15),
                                        headers={'User-Agent': 'TeachingJobRadar-TLS-Diagnostic/1.0'}) as reply:
                          result.update(verification_status='verified', http_status=reply.status_code)
                  except requests.exceptions.SSLError as error:
                      result['verification_status'] = tls_reason(error)
                  except requests.exceptions.Timeout:
                      result['verification_status'] = 'connection_timeout'
                  except requests.exceptions.RequestException:
                      result['verification_status'] = 'connection_failed'
              print(json.dumps(result, sort_keys=True), flush=True)
          PY
